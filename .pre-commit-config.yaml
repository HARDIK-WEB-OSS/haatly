default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.ps1$
  - repo: local
    hooks:
      - id: no-comments
        name: no comments or docstrings
        entry: uv run --locked python tools/check_no_comments.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: import-linter
        name: import-linter
        entry: uv run --locked lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        types: [python]

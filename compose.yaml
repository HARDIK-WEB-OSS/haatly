name: haatly

services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_line_prefix=%m [%p] %u@%d "]
    environment:
      POSTGRES_DB: haatly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      HAATLY_DB_OWNER_PASSWORD: ${HAATLY_DB_OWNER_PASSWORD:?set HAATLY_DB_OWNER_PASSWORD in .env}
      HAATLY_DB_APP_PASSWORD: ${HAATLY_DB_APP_PASSWORD:?set HAATLY_DB_APP_PASSWORD in .env}
      HAATLY_DB_OPS_PASSWORD: ${HAATLY_DB_OPS_PASSWORD:?set HAATLY_DB_OPS_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb/01-roles.sql:/docker-entrypoint-initdb.d/20-haatly-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haatly"]
      interval: 2s
      timeout: 5s
      retries: 30

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    entrypoint: ["/bin/sh", "/opt/haatly/start-tigerbeetle.sh"]
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - tigerbeetle-data:/data
      - ./docker/tigerbeetle/start-tigerbeetle.sh:/opt/haatly/start-tigerbeetle.sh:ro

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  postgres-data:
  tigerbeetle-data:
  caddy-data:
